name: Bug report
description: Report a reproducible ContextCourier failure.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Never paste a credential, private archive, or secret-bearing file. Use a synthetic reproduction.
  - type: input
    id: version
    attributes:
      label: ContextCourier version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and Git versions
      placeholder: "Python 3.13.5; git 2.50.1"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal synthetic reproduction
      description: Include commands and safe fixture structure, never private content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, usernames, absolute paths, and private source from this report.
          required: true
